[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "1.0.0"
description = "Expense tracker and budget analyzer with categorization, forecasting, dashboard and API"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3",
  "matplotlib>=3.7", "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "fastapi>=0.100", "uvicorn>=0.23", "httpx>=0.25"]
dev = ["pytest>=7.4"]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
